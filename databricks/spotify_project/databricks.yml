# This is a Databricks asset bundle definition for spotify_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: spotify_project
  uuid: 266e9640-8b2d-47bb-a947-d4b057133f62

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: system
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/manumandal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/manumandal@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: system
      schema: prod
    permissions:
      - user_name: manumandal@gmail.com
        level: CAN_MANAGE
